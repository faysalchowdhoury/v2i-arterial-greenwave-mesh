[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "v2i-arterial-greenwave-mesh"
version = "1.0.0"
description = "SPaT broadcast + GLOSA speed advisory on a signalized arterial: stops, travel time, fuel and CO2 vs. penetration and packet loss."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.26", "pandas>=2.2", "pydantic>=2.6,<3", "matplotlib>=3.8"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "httpx>=0.27"]
dev = ["pytest>=8.0"]

[project.scripts]
greenwave = "greenwave.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
